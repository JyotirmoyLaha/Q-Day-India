- id: docker-old-tls-stack
  kind: regex
  files: ['Dockerfile', 'Dockerfile.*', '*.dockerfile', 'Containerfile']
  pattern: '^[ \t]*FROM[ \t]+(?:--platform=\S+[ \t]+)?(?<alg>\S+)'
  flags: im
  parameter: 'group:alg'
  variants:
    - { match: '(^|/)debian:(stretch|buster|bullseye|bookworm|9|10|11|12)\b', algorithm: Debian ≤ 12 (OpenSSL < 3.5) }
    - { match: '(^|/)ubuntu:(xenial|bionic|focal|jammy|noble|oracular|plucky|1[0-9]\.\d+|2[0-4]\.\d+|25\.04)\b', algorithm: Ubuntu ≤ 25.04 (OpenSSL < 3.5) }
    - { match: '(^|/)alpine:3\.([0-9]|1[0-9]|2[01])(\.|$|-)', algorithm: Alpine ≤ 3.21 (OpenSSL < 3.5) }
    - { match: '(^|/)(centos|amazonlinux:2\b|rockylinux:8|almalinux:8)', algorithm: EL8 / CentOS / AL2 (OpenSSL < 3.5) }
    - { match: '-(stretch|buster|bullseye|bookworm|focal|jammy|noble)\b', algorithm: Debian/Ubuntu-based image (OpenSSL < 3.5) }
    - { match: '(^|/)golang:1\.(1[0-9]|2[0-3])\b', algorithm: Go < 1.24 toolchain (no PQ TLS default), fix: go-tls-pq }
    - { match: '(^|/)node:(1[0-9]|20|21|23)(\b|$)', algorithm: Node.js < 22.20 (OpenSSL < 3.5), fix: node-tls-pq }
    - { match: '.', skip: true }
  algorithm: TLS stack without ML-KEM
  primitive: key-agreement
  quantum_risk: HIGH
  confidence: medium
  fix: docker-openssl
  message: Base image ships a TLS stack that cannot negotiate X25519MLKEM768.

- id: docker-apt-old-openssl
  kind: regex
  files: ['Dockerfile', 'Dockerfile.*', '*.dockerfile', 'Containerfile']
  pattern: '(?:apt-get|apt|apk|yum|dnf)[ \t]+(?:-\S+[ \t]+)*(?:install|add)[^\n]*?\b(?<alg>openssl=1\.[\w.*-]*|openssl=3\.[0-4][\w.*-]*|libssl1\.\d|openssl1\.1[\w-]*|openssl-1\.[\w.*-]*)'
  flags: im
  algorithm: OpenSSL < 3.5 pinned
  primitive: key-agreement
  quantum_risk: HIGH
  fix: docker-openssl
  message: Image pins an OpenSSL version that cannot negotiate X25519MLKEM768.

- id: terraform-aws-ssl-policy
  kind: regex
  files: ['*.tf', '*.tf.json', '*.yaml', '*.yml', '*.json', '*.template']
  pattern: "(?:ssl_?policy|SslPolicy)['\"]?[ \\t]*[=:][ \\t]*['\"](?<alg>ELBSecurityPolicy-[\\w.-]+)['\"]"
  flags: im
  parameter: 'group:alg'
  variants:
    - { match: '-PQ-', skip: true }
    - { match: '(TLS-1-0|TLS-1-1|2015-0|2016-08|FS-2018|FS-1-1|TLS13-1-0|TLS13-1-1)', algorithm: ELB policy allowing TLS 1.0/1.1 without PQ, quantum_risk: CLASSICAL_BROKEN }
    - { match: '.', algorithm: ELB policy without PQ hybrid }
  algorithm: ELB policy without PQ hybrid
  primitive: key-agreement
  quantum_risk: HIGH
  asset_type: protocol
  fix: cloud-tls-policy
  message: AWS load-balancer TLS policy offers no post-quantum hybrid (use a *-PQ-2025-09 policy).

- id: terraform-min-tls-version
  kind: regex
  files: ['*.tf', '*.tf.json', '*.yaml', '*.yml', '*.json', '*.bicep']
  pattern: "(?:minimum_protocol_version|min_tls_version|minimum_tls_version|minTlsVersion|MinimumProtocolVersion)['\"]?[ \\t]*[=:][ \\t]*['\"](?<alg>[^'\"]+)['\"]"
  flags: im
  variants:
    - { match: '^(SSLv3|TLSv1|TLSv1_2016|TLSv1\.1_2016|1\.0|1\.1|TLS1_0|TLS1_1|TLS_1_0|TLS_1_1|Tls|Tls11)$' }
    - { match: '.', skip: true }
  algorithm: TLS 1.0/1.1
  primitive: key-agreement
  quantum_risk: CLASSICAL_BROKEN
  asset_type: protocol
  fix: cloud-tls-policy
  message: Cloud resource allows TLS 1.0/1.1.

- id: k8s-ingress-ssl-protocols
  kind: regex
  files: ['*.yaml', '*.yml']
  pattern: "^[ \\t]*ssl-protocols:[ \\t]*['\"]?(?<alg>[^'\"\\n]+)"
  flags: im
  variants:
    - { match: '(^|\s)(SSLv3|TLSv1|TLSv1\.1)(\s|$)' }
    - { match: '.', skip: true }
