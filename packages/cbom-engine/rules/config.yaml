# Config / infrastructure rules (regex). Lines starting with a comment prefix are ignored.
# Named group "alg" selects the variant unless variant_from says otherwise.

- id: nginx-ecdh-curve
  kind: regex
  files: ['*.conf', 'nginx*', '*.nginx', '*.vhost', 'sites-available/*', 'sites-enabled/*']
  pattern: '^[ \t]*ssl_ecdh_curve[ \t]+(?<alg>[^;\n]+);'
  flags: im
  parameter: 'group:alg'
  variants:
    - { match: 'mlkem', skip: true }
    - { match: '.' }
  algorithm: TLS groups without ML-KEM
  primitive: key-agreement
  quantum_risk: HIGH
  asset_type: protocol
  fix: tls-nginx-pq
  message: nginx ssl_ecdh_curve offers no post-quantum hybrid — connections use classical key exchange.

- id: nginx-ssl-protocols-legacy
  kind: regex
  files: ['*.conf', 'nginx*', '*.nginx', '*.vhost', 'sites-available/*', 'sites-enabled/*']
  pattern: '^[ \t]*ssl_protocols[ \t]+(?<alg>[^;\n]+);'
  flags: im
  variants:
    - { match: '(^|\s)(SSLv2|SSLv3|TLSv1|TLSv1\.1)(\s|$)', parameter: '1.0/1.1' }
    - { match: '.', skip: true }
  algorithm: TLS 1.0/1.1
  primitive: key-agreement
  quantum_risk: CLASSICAL_BROKEN
  asset_type: protocol
  fix: tls-legacy-protocols
  message: nginx ssl_protocols still enables TLS 1.0/1.1 (deprecated by RFC 8996).

- id: nginx-ssl-protocols-no-tls13
  kind: regex
  files: ['*.conf', 'nginx*', '*.nginx', '*.vhost', 'sites-available/*', 'sites-enabled/*']
  pattern: '^[ \t]*ssl_protocols[ \t]+(?<alg>[^;\n]+);'
  flags: im
  variants:
    - { match: 'TLSv1\.3', skip: true }
    - { match: '.' }
  algorithm: TLS without 1.3
  primitive: key-agreement
  quantum_risk: HIGH
  asset_type: protocol
  fix: tls-nginx-pq
  message: nginx ssl_protocols lacks TLSv1.3 — post-quantum key exchange impossible.

- id: nginx-ssl-ciphers-weak
  kind: regex
  files: ['*.conf', 'nginx*', '*.nginx', '*.vhost']
  pattern: "^[ \\t]*ssl_ciphers[ \\t]+['\"]?(?<alg>[^;'\"\\n]+)"
  flags: im
  variants:
    - { match: '(^|:)(?!!)[A-Z0-9-]*(RC4|DES|NULL|EXPORT|MD5)', algorithm: RC4/3DES/NULL cipher suites }
    - { match: '.', skip: true }
  algorithm: Weak cipher suites
  primitive: symmetric
  quantum_risk: CLASSICAL_BROKEN
  fix: legacy-ciphers
  message: ssl_ciphers enables RC4/DES/NULL/EXPORT/MD5 suites.

- id: apache-curves
  kind: regex
  files: ['*.conf', 'httpd*', 'apache*', 'ssl.conf', '.htaccess']
  pattern: '^[ \t]*SSLOpenSSLConfCmd[ \t]+(Curves|Groups)[ \t]+(?<alg>\S+)'
  flags: im
  parameter: 'group:alg'
  variants:
    - { match: 'mlkem', skip: true }
    - { match: '.' }
  algorithm: TLS groups without ML-KEM
  primitive: key-agreement
  quantum_risk: HIGH
  asset_type: protocol
  fix: tls-apache-pq
  message: Apache SSLOpenSSLConfCmd Curves/Groups offers no post-quantum hybrid.

- id: apache-protocol-legacy
  kind: regex
  files: ['*.conf', 'httpd*', 'apache*', 'ssl.conf', '.htaccess']
  pattern: '^[ \t]*SSLProtocol[ \t]+(?<alg>[^\n#]+)'
  flags: im
  variants:
    - { match: '(^|\s)\+?(SSLv3|TLSv1|TLSv1\.1)(\s|$)', parameter: '1.0/1.1' }
    - { match: '^(?!.*-TLSv1(\s|$)).*(^|\s)all(\s|$)', parameter: '1.0/1.1' }
    - { match: '.', skip: true }
  algorithm: TLS 1.0/1.1
  primitive: key-agreement
  quantum_risk: CLASSICAL_BROKEN
  asset_type: protocol
  fix: tls-apache-pq
  message: Apache SSLProtocol still enables TLS 1.0/1.1 ("all" includes them unless removed).

