  fix: k8s-ingress-tls
  message: Ingress ssl-protocols still enables TLS 1.0/1.1.

- id: k8s-ingress-ecdh-curve
  kind: regex
  files: ['*.yaml', '*.yml']
  pattern: "^[ \\t]*ssl-ecdh-curve:[ \\t]*['\"]?(?<alg>[^'\"\\n]+)"
  flags: im
  parameter: 'group:alg'
  variants:
    - { match: 'mlkem|^auto$', skip: true }
    - { match: '.' }
  algorithm: TLS groups without ML-KEM
  primitive: key-agreement
  quantum_risk: HIGH
