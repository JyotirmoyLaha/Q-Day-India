  message: MD5/SHA-1 via hashlib — collision attacks exist today.

- id: py-hashlib-new-weak
  language: python
  kind: treesitter
  callee: '^hashlib\.new$'
  args: { '0': '^(md5|sha1|sha-1|md4)$' }
  variants:
    - { match: '^md[45]$', algorithm: MD5 }
    - { match: '^sha-?1$', algorithm: SHA-1 }
  algorithm: MD5
  primitive: hash
  quantum_risk: CLASSICAL_BROKEN
  fix: hash-md5-sha1
  message: Weak hash via hashlib.new — collision attacks exist today.

- id: py-pycryptodome-pubkey
  language: python
  kind: treesitter
  callee: '^(Crypto\.PublicKey\.|Cryptodome\.PublicKey\.)?(RSA|ECC|DSA)\.(generate|construct|import_key|importKey)$'
  variant_from: callee
  key_size: 'kwarg:bits|arg0'
  parameter: 'kwarg:curve'
  variants:
    - { match: '(^|\.)RSA\.', algorithm: RSA, primitive: pke, fix: python-pqc }
    - { match: '(^|\.)ECC\.', algorithm: ECC, primitive: signature, fix: python-pqc }
    - { match: '(^|\.)DSA\.', algorithm: DSA, primitive: signature, fix: python-pqc }
  algorithm: RSA
  primitive: pke
  quantum_risk: HIGH
  message: Public-key operation with PyCryptodome — not quantum-safe.

- id: py-pycryptodome-schemes
  language: python
