- id: py-jwt-algorithm
  language: python
  kind: treesitter
  callee: '^(jwt|jws|jose\.jwt|jose\.jws)\.(encode|decode|sign|verify)$'
  variant_from: 'kwarg:algorithm|kwarg:algorithms'
  variants:
    - { match: '^PS\d{3}$', algorithm: RSA-PSS }
    - { match: '^RS\d{3}$', algorithm: RSA }
    - { match: '^ES\d{3}K?$', algorithm: ECDSA }
    - { match: '^EdDSA$', algorithm: Ed25519 }
    - { match: '.', skip: true }
  algorithm: RSA
  primitive: signature
  quantum_risk: HIGH
  fix: jwt-crypto-agility
  message: JWT signed/verified with a classical public-key algorithm — plan for crypto-agility.
