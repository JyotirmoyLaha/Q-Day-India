  message: RSA key generation (python-rsa) — not quantum-safe.

- id: py-ssl-legacy-protocol
  language: python
  kind: treesitter
  query: |
    ((attribute object: (identifier) @mod attribute: (identifier) @attr) @match
      (#eq? @mod "ssl")
      (#match? @attr "^PROTOCOL_(TLSv1|TLSv1_1|SSLv2|SSLv3)$"))
  variant_from: 'capture:attr'
  variants:
    - { match: 'TLSv1_1', algorithm: TLS 1.1, parameter: '1.1' }
    - { match: 'TLSv1$', algorithm: TLS 1.0, parameter: '1.0' }
    - { match: 'SSLv', algorithm: SSLv3, parameter: '3.0' }
  algorithm: TLS 1.0
  primitive: key-agreement
  quantum_risk: CLASSICAL_BROKEN
  asset_type: protocol
  fix: tls-legacy-protocols
  message: Deprecated TLS/SSL protocol version pinned.

- id: py-ssl-tlsversion-legacy
  language: python
  kind: treesitter
  query: |
    ((attribute object: (attribute object: (identifier) @mod attribute: (identifier) @cls) attribute: (identifier) @attr) @match
      (#eq? @mod "ssl") (#eq? @cls "TLSVersion")
      (#match? @attr "^(TLSv1|TLSv1_1|SSLv3)$"))
  variant_from: 'capture:attr'
  variants:
    - { match: 'TLSv1_1', algorithm: TLS 1.1, parameter: '1.1' }
    - { match: 'TLSv1$', algorithm: TLS 1.0, parameter: '1.0' }
    - { match: 'SSLv3', algorithm: SSLv3, parameter: '3.0' }
  algorithm: TLS 1.0
  primitive: key-agreement
  quantum_risk: CLASSICAL_BROKEN
  asset_type: protocol
  fix: tls-legacy-protocols
  message: Minimum/maximum TLS version set to a deprecated protocol.

- id: py-ssl-ecdh-curve
  language: python
