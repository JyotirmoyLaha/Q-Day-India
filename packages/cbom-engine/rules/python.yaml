    - { match: '^(pkcs1_15|pss)', algorithm: RSA, primitive: signature, fix: signatures-to-mldsa }
    - { match: '^DSS', algorithm: ECDSA/DSA, primitive: signature, fix: signatures-to-mldsa }
  algorithm: RSA
  primitive: pke
  quantum_risk: HIGH
  confidence: medium
  message: RSA/DSA scheme (PyCryptodome) — not quantum-safe.

