- id: py-cryptography-x25519
  language: python
  kind: treesitter
  callee: '(^|\.)(X25519|X448)PrivateKey\.generate$'
  variant_from: callee
  variants:
    - { match: 'X448', algorithm: X448 }
    - { match: 'X25519', algorithm: X25519 }
  algorithm: X25519
  primitive: key-agreement
  quantum_risk: HIGH
  fix: ecdh-to-hybrid
  message: X25519/X448 key agreement — exposed to harvest-now-decrypt-later without an ML-KEM hybrid.

