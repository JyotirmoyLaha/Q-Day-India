- id: py-cryptography-weak-hash
  language: python
  kind: treesitter
  callee: '(^|\.)hashes\.(MD5|SHA1)$'
  variant_from: callee
  variants:
    - { match: 'MD5$', algorithm: MD5 }
    - { match: 'SHA1$', algorithm: SHA-1 }
  algorithm: MD5
  primitive: hash
  quantum_risk: CLASSICAL_BROKEN
  fix: hash-md5-sha1
  message: MD5/SHA-1 hash — collision attacks exist today.

- id: py-cryptography-pq
  language: python
  kind: treesitter
  callee: '(^|\.)(MLKEM\d+|MLDSA\d+)PrivateKey\.generate$'
  variant_from: callee
  variants:
    - { match: 'MLKEM512', algorithm: ML-KEM-512, primitive: kem }
    - { match: 'MLKEM768', algorithm: ML-KEM-768, primitive: kem }
    - { match: 'MLKEM1024', algorithm: ML-KEM-1024, primitive: kem }
    - { match: 'MLDSA44', algorithm: ML-DSA-44 }
    - { match: 'MLDSA65', algorithm: ML-DSA-65 }
    - { match: 'MLDSA87', algorithm: ML-DSA-87 }
  algorithm: ML-DSA
  primitive: signature
  quantum_risk: NONE
  fix: pq-library-present
  message: Post-quantum algorithm in use (pyca/cryptography).

