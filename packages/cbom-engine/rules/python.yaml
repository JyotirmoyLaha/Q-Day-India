# Python rules (tree-sitter). Call rules match the dotted callee text of every call;
# see src/types.ts (Rule) for the fields.

- id: py-cryptography-rsa-generate
  language: python
  kind: treesitter
  callee: '(^|\.)rsa\.generate_private_key$'
  key_size: 'kwarg:key_size|arg1'
  algorithm: RSA
  primitive: pke
  quantum_risk: HIGH
  fix: py-rsa-to-mlkem
  message: RSA key generation (pyca/cryptography) — not quantum-safe.

- id: py-cryptography-rsa-padding
  language: python
  kind: treesitter
  callee: '(^|\.)padding\.(OAEP|PKCS1v15|PSS)$'
  variant_from: callee
  variants:
    - {
        match: 'OAEP|PKCS1v15',
        algorithm: RSA,
        primitive: pke,
        message: RSA encryption padding in use — RSA is not quantum-safe.,
        fix: py-rsa-to-mlkem,
      }
    - {
        match: 'PSS',
        algorithm: RSA-PSS,
        primitive: signature,
        message: RSA-PSS signature padding in use — not quantum-safe.,
        fix: signatures-to-mldsa,
      }
  algorithm: RSA
  primitive: pke
  quantum_risk: HIGH
  confidence: medium
  message: RSA operation (pyca/cryptography).

- id: py-cryptography-ec-generate
  language: python
  kind: treesitter
  callee: '(^|\.)ec\.generate_private_key$'
  parameter: 'regex:(SECP\d+[RK]1|BrainpoolP\d+R1|SECT\d+[RK]1)'
  algorithm: ECC
  primitive: signature
  quantum_risk: HIGH
  fix: signatures-to-mldsa
  message: Elliptic-curve key generation (pyca/cryptography) — not quantum-safe.

- id: py-cryptography-ecdh
  language: python
  kind: treesitter
  callee: '\.exchange$'
  args: { '0': '(^|\.)ECDH\(\)$' }
  algorithm: ECDH
  primitive: key-agreement
  quantum_risk: HIGH
  fix: ecdh-to-hybrid
  message: ECDH key agreement — exposed to harvest-now-decrypt-later.

