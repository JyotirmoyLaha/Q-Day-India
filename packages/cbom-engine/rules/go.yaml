# Go rules (tree-sitter).

- id: go-crypto-import
  language: go
  kind: treesitter
  query: '(import_spec path: (interpreted_string_literal) @path) @match'
  variant_from: 'capture:path'
  variants:
    - { match: '^crypto/rsa$', algorithm: RSA, primitive: pke }
    - { match: '^crypto/ecdsa$', algorithm: ECDSA, primitive: signature }
    - { match: '^(crypto|golang\.org/x/crypto)/ed25519$', algorithm: Ed25519, primitive: signature }
    - { match: '^crypto/elliptic$', algorithm: ECC, primitive: signature }
    - { match: '^crypto/dsa$', algorithm: DSA, primitive: signature }
    - { match: '^crypto/ecdh$', algorithm: ECDH, primitive: key-agreement, fix: ecdh-to-hybrid }
    - { match: '^golang\.org/x/crypto/curve25519$', algorithm: X25519, primitive: key-agreement, fix: ecdh-to-hybrid }
    - { match: '^crypto/md5$', algorithm: MD5, primitive: hash, quantum_risk: CLASSICAL_BROKEN, fix: hash-md5-sha1, message: Imports crypto/md5 — collision attacks exist today. }
    - { match: '^crypto/sha1$', algorithm: SHA-1, primitive: hash, quantum_risk: CLASSICAL_BROKEN, fix: hash-md5-sha1, message: Imports crypto/sha1 — collision attacks exist today. }
    - { match: '^crypto/des$', algorithm: DES/3DES, primitive: symmetric, quantum_risk: CLASSICAL_BROKEN, fix: legacy-ciphers, message: Imports crypto/des — legacy cipher. }
    - { match: '^crypto/rc4$', algorithm: RC4, primitive: symmetric, quantum_risk: CLASSICAL_BROKEN, fix: legacy-ciphers, message: Imports crypto/rc4 — legacy cipher. }
    - { match: '^crypto/mlkem$', algorithm: ML-KEM, primitive: kem, quantum_risk: NONE, fix: pq-library-present, message: Imports crypto/mlkem — post-quantum. }
    - { match: '^crypto/mldsa$', algorithm: ML-DSA, primitive: signature, quantum_risk: NONE, fix: pq-library-present, message: Imports crypto/mldsa — post-quantum. }
    - { match: '^github\.com/cloudflare/circl/(kem|sign)/(mlkem|mldsa)', algorithm: ML-KEM/ML-DSA, primitive: kem, quantum_risk: NONE, fix: pq-library-present, message: Imports CIRCL post-quantum package. }
    - { match: '.', skip: true }
  algorithm: RSA
  primitive: pke
  quantum_risk: HIGH
  confidence: medium
  fix: go-crypto-migration
  message: Imports a classical public-key package — not quantum-safe.

- id: go-rsa-generate
  language: go
  kind: treesitter
  callee: '^rsa\.GenerateKey$'
  key_size: arg1
  algorithm: RSA
  primitive: pke
  quantum_risk: HIGH
  fix: go-crypto-migration
  message: RSA key generation — not quantum-safe.

- id: go-ecdsa-generate
  language: go
  kind: treesitter
  callee: '^ecdsa\.GenerateKey$'
  parameter: 'regex:elliptic\.(P\d+)'
  algorithm: ECDSA
  primitive: signature
  quantum_risk: HIGH
  fix: go-crypto-migration
  message: ECDSA key generation — not quantum-safe.

- id: go-ecdh-curve
  language: go
  kind: treesitter
  callee: '^ecdh\.(P256|P384|P521|X25519)$'
  variant_from: callee
  variants:
    - { match: 'X25519', algorithm: X25519 }
    - { match: 'P(\d+)', algorithm: ECDH }
  algorithm: ECDH
  primitive: key-agreement
  quantum_risk: HIGH
  fix: ecdh-to-hybrid
  message: ECDH key agreement — exposed to harvest-now-decrypt-later.

- id: go-tls-curve-preferences
  language: go
  kind: treesitter
  query: |
    ((keyed_element . (literal_element (identifier) @key) . (literal_element) @val) @match
      (#eq? @key "CurvePreferences"))
  variant_from: 'capture:val'
  variants:
    - { match: 'MLKEM', skip: true }
    - { match: '.' }
  algorithm: ECDH
  primitive: key-agreement
  quantum_risk: HIGH
  asset_type: protocol
  fix: go-tls-pq
  message: tls.Config CurvePreferences excludes the post-quantum hybrid (X25519MLKEM768).

- id: go-tls-version
  language: go
  kind: treesitter
  query: |
    ((keyed_element . (literal_element (identifier) @key) . (literal_element) @val) @match
      (#match? @key "^(MinVersion|MaxVersion)$"))
  variant_from: match
  variants:
    - { match: 'MinVersion\s*:\s*tls\.Version(TLS10|TLS11|SSL30)\b', algorithm: TLS 1.0/1.1, quantum_risk: CLASSICAL_BROKEN, fix: tls-legacy-protocols, message: tls.Config MinVersion allows deprecated TLS 1.0/1.1. }
    - { match: 'MaxVersion\s*:\s*tls\.Version(TLS10|TLS11|TLS12)\b', algorithm: TLS ≤ 1.2, quantum_risk: HIGH, fix: go-tls-pq, message: tls.Config MaxVersion below TLS 1.3 — post-quantum key exchange impossible. }
    - { match: '.', skip: true }
  algorithm: TLS
  primitive: key-agreement
  quantum_risk: CLASSICAL_BROKEN
  asset_type: protocol
  message: TLS version setting.
